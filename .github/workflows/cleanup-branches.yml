name: Remove merged agent branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time merged branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete merged agent branches
        run: |
          set -euo pipefail
          branches=(
            "agent/autonomous-beta-production"
            "agent/b01-meet-your-jdxi"
            "agent/b02-first-sound"
            "agent/complete-rear-panel-registry"
            "agent/hardware-target-registry"
            "agent/header-branding-swap"
            "agent/home-baseline-repair"
            "agent/lesson-renderer"
            "agent/n01-menu-controls"
            "agent/rear-panel-count-closeout"
            "agent/rear-panel-integration"
            "agent/roland-source-reconciliation"
            "agent/tutorial-architecture"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
